
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="pokedex">
        <div class="pokedex-top">
            <div class="pokedex-button big-blue"></div>
            <div class="pokedex-button small-red"></div>
            <div class="pokedex-button small-yellow"></div>
            <div class="pokedex-button small-green"></div>
        </div>
        <div class="pokedex-screen-container">
            <div class="pokedex-screen">
                <div class="pokemon-display">
                    <img id="sprite" src="https://models.spriters-resource.com/media/preview_icons/352/355632.png?updated=1755516205" alt="Pokemon">
                </div>
                <div class="pokemon-details">
                    <h2 class="pokemon-name" id="nome">Nome</h2>
                    <p class="pokemon-id" id="numero">Nº</p>
                    <p class="pokemon-type" id="tipo">Tipo:</p>
                    <p class="pokemon-description" id="desc">Descrição</p>
                </div>
            </div>
            <div class="pokedex-screen-buttons">
                <div class="pokedex-button small-green"></div>
                <div class="pokedex-button small-green"></div>
            </div>
        </div>
        
        <div class="pokedex-controls">
            <div class="pokedex-dpad">
                <div class="dpad-vertical"></div>
                <div class="dpad-horizontal"></div>
            </div>
            
            <div class="search-area">
                <input type="text" id="buscar_nome" placeholder="Nome do Pokemon" class="pokemon-input" required>
                <button onclick="buscarPokemon()" id="buscar" class="pokedex-button black-button">Buscar</button>
            </div>
        </div>
    </div>

</body>
<script src="script.js"></script>
</html>
